<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Gerador de Ingresso para Conferência</title>
</head>
<body>

  <img class="pattern-lines" src="assets/images/pattern-lines.svg" alt="">
  <img class="pattern-circle" src="assets/images/pattern-circle.svg" alt="">
  <img class="pattern-top" src="assets/images/pattern-squiggly-line-top.svg" alt="">
  <img class="pattern-bottom" src="assets/images/pattern-squiggly-line-bottom-desktop.svg" alt="">

<header>
  <img src="assets/images/logo-full.svg" alt="Logo Coding Conf">
</header>

<main>

<section id="text">
<h1>Your Journey to Coding Conf <span>2025 Starts Here!</span></h1>

<p>Secure your spot at next year s biggest coding conference</p>
</section>

  <form action="">
          <div class="input-group">
        <label for="avatar">Upload Avatar</label>

        <div class="upload">
          <div class="upload-icon">
            <img src="assets/images/icon-upload.svg" alt="">
          </div>

          <span>Drag and drop or click to upload</span>
        </div>

        <small>
          <img src="./assets/images/icon-info.svg" alt="">
           Upload your photo (JPG or PNG, max size: 500KB).
        </small>
      </div>


      <div class="input-group">
        <label for="name">Full Name</label>
        <input type="text" id="name">
      </div>


      <div class="input-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="example@email.com"
        >
      </div>


      <div class="input-group">
        <label for="github">GitHub Username</label>
        <input
          type="text"
          id="github"
          placeholder="@yourusername"
        >
      </div>


      <button type="submit">
        Generate My Ticket
      </button>
  </form>
</main>

</body>
</html>
